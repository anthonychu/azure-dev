# Proposed target contract; this ordering requires the provider changes in PROPOSAL.md.
name: prompt-agent-custom-infra

infra:
  provider: microsoft.foundry
  layers:
    - name: app
      provider: bicep
      path: ./infra/app
    - name: foundry
      path: .
      dependsOn:
        - app

services:
  foundry-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-sol
        model:
          format: OpenAI
          name: gpt-5.6-sol
          version: ${GPT_5_6_SOL_VERSION}
        sku:
          name: GlobalStandard
          capacity: 10

  search:
    host: azure.ai.connection
    uses:
      - foundry-project
    category: CognitiveSearch
    target: ${AZURE_SEARCH_ENDPOINT}
    authType: ProjectManagedIdentity
    metadata:
      resourceId: ${AZURE_SEARCH_RESOURCE_ID}

  search-agent:
    host: azure.ai.agent
    # `project` is the local service source path, not the Foundry project.
    project: ./agents/search-agent
    uses:
      - foundry-project
      - search
