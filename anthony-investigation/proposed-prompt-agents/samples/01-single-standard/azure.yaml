# Proposed contract; the current branch does not accept every field yet.
name: prompt-agent-basic

infra:
  provider: microsoft.foundry

services:
  foundry-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.6-sol
        model:
          format: OpenAI
          name: gpt-5.6-sol
          version: ${GPT_5_6_SOL_VERSION}
        sku:
          name: GlobalStandard
          capacity: 10

  support:
    host: azure.ai.agent
    # `project` is the local service source path, not the Foundry project.
    project: ./agents/support
    uses:
      - foundry-project
